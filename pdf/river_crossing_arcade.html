<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RIVER RUN '86 — Pixel Arcade</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:#100d24;color:#f8edb9;font-family:'Courier New',monospace;min-height:100%;touch-action:manipulation}body{display:flex;align-items:center;justify-content:center;padding:12px}.wrap{width:min(100%,880px);text-align:center}.heading{font-size:clamp(19px,4vw,32px);letter-spacing:4px;color:#ffcc36;text-shadow:3px 3px #e54076;margin:8px 0}.sub{font-size:12px;color:#7cf6de;letter-spacing:2px;margin:0 0 10px}.screen{border:6px solid #5a3b99;box-shadow:0 0 0 3px #17102f,0 0 35px #3f2892;position:relative;background:#111;aspect-ratio:640/576;max-height:calc(100dvh - 205px);margin:auto}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{display:flex;justify-content:space-between;font-weight:bold;gap:8px;margin:10px auto 3px;max-width:640px;color:#ffdc64;font-size:13px}.buttons{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:640px;margin:12px auto 0}.controls{display:grid;grid-template-columns:repeat(3,49px);grid-template-rows:repeat(2,43px);gap:5px}.controls button{font-weight:bold;font-size:23px;border:2px solid #7af3ff;background:#313267;color:#fff;box-shadow:3px 3px #121126;touch-action:none;border-radius:4px}.controls button:active,.action:active{transform:translate(2px,2px);box-shadow:none}.controls .up{grid-column:2;grid-row:1}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.action{font-family:inherit;font-weight:bold;border:2px solid #f9d54e;background:#cd3970;color:#fff9dc;padding:13px 16px;box-shadow:3px 3px #41204e;border-radius:4px;cursor:pointer}.instruction{color:#b6acd8;font-size:11px;line-height:1.5;max-width:400px;text-align:right}.instruction strong{color:#fff}.bottom{font-size:11px;color:#817baf;margin-top:10px}@media(max-width:480px){body{padding:5px}.screen{max-height:calc(100dvh - 245px)}.heading{letter-spacing:2px}.buttons{gap:6px}.instruction{font-size:10px}.controls{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,41px)}}

<body><main class="wrap"><h1 class="heading">★ RIVER RUN '86 ★</h1><p class="sub">CROSS THE CURRENT • CHOOSE YOUR RIDE</p><div class="screen"><canvas id="game" width="640" height="576" aria-label="Pixel-art river crossing game"></canvas></div><div class="hud"><span id="lives">♥ ♥ ♥</span><span id="score">SCORE 00000</span><span id="level">STAGE 01</span></div><div class="buttons"><div class="controls"><button class="up" data-dir="up" aria-label="Up">▲</button><button class="left" data-dir="left" aria-label="Left">◀</button><button class="down" data-dir="down" aria-label="Down">▼</button><button class="right" data-dir="right" aria-label="Right">▶</button></div><div class="instruction"><strong>ARROWS / WASD</strong> TO MOVE<br>DODGE ROCKS & CROCODILES<br>RIDE LOGS • REACH THE FAR BANK<br>PICK A TRUCK, VAN OR PARTY BUS</div><button id="start" class="action">START / RESTART</button></div><div class="bottom">MADE OF PIXELS • BEST PLAYED WITH SOUND ON</div></main>
<script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const W=640,H=576,T=40;let state='title',life=3,score=0,stage=1,frame=0,player={x:304,y:504,w:24,h:30},message='',msgTimer=0,invuln=0,selected=-1,levelClock=0;const lanes=[],sparkles=[],buttons=['BIG RIG','VAN','PARTY BUS'];let audio;function sfx(freq=440,dur=.09,type='square',gain=.045){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(60,freq*.65),audio.currentTime+dur);v.gain.setValueAtTime(gain,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}const rect=(x,y,w,h,color)=>{g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))},txt=(s,x,y,size=16,color='#fff',align='center')=>{g.font=`bold ${size}px monospace`;g.fillStyle='#170e38';g.textAlign=align;g.fillText(s,x+2,y+2);g.fillStyle=color;g.fillText(s,x,y)},overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;function restart(){life=3;score=0;stage=1;selected=-1;state='playing';resetLevel();updateHud();sfx(620,.2)}function resetLevel(){player.x=304;player.y=504;invuln=55;levelClock=0;lanes.length=0;const kinds=[['croc',1.25,3],['log',-1.6,2],['rock',.85,3],['log',1.75,3],['croc',-1.4,2],['rock',1.1,3],['log',-1.25,2],['croc',1.5,2],['rock',-1,3]];kinds.forEach(([type,spd,count],i)=>{let y=440-i*40;const objects=[];for(let j=0;j<count;j++)objects.push({x:j*(640/count)+((i*91)%180)-80,y:y+7,w:type==='log'?103:type==='croc'?80:34,h:type==='log'?27:type==='croc'?29:30});lanes.push({type,speed:spd*(1+(stage-1)*.16),objects,y})})}function updateHud(){document.querySelector('#lives').textContent='♥ '.repeat(Math.max(0,life));document.querySelector('#score').textContent='SCORE '+String(score).padStart(5,'0');document.querySelector('#level').textContent='STAGE '+String(stage).padStart(2,'0')}function damage(){if(invuln>0||state!=='playing')return;life--;sfx(150,.33,'sawtooth');for(let i=0;i<24;i++)sparkles.push({x:player.x+12,y:player.y+12,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,t:24,color:i%2?'#ff568e':'#ffe45f'});updateHud();if(life<=0){state='gameover'}else{player.x=304;player.y=504;invuln=95}}function move(dir){if(state==='title'||state==='gameover'||state==='won'){restart();return}if(state==='choice'){if(dir==='left')selected=Math.max(0,selected-1);if(dir==='right')selected=Math.min(2,selected+1);if(dir==='up'||dir==='down'){if(selected===-1)selected=1;else win()}sfx(560,.045);return}let oldY=player.y;if(dir==='up')player.y-=T;else if(dir==='down')player.y+=T;else if(dir==='left')player.x-=T;else if(dir==='right')player.x+=T;player.x=Math.max(8,Math.min(608,player.x));player.y=Math.min(504,player.y);if(player.y!==oldY&&dir==='up')score+=10;if(player.y<=64){state='choice';score+=500;selected=1;sfx(800,.2);setTimeout(()=>sfx(1100,.23),140);message='YOU MADE IT! CHOOSE YOUR RIDE';msgTimer=100}updateHud();sfx(330,.042)}function win(){state='won';score+=1000;updateHud();for(let i=0;i<90;i++)sparkles.push({x:Math.random()*640,y:Math.random()*470,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,t:50+Math.random()*70,color:['#ffe15e','#e94989','#75e3fe','#87f48e'][i%4]});sfx(1060,.28)}function drawPerson(){let x=Math.round(player.x),y=Math.round(player.y);if(invuln>0&&Math.floor(frame/5)%2===0)return;rect(x+6,y,12,6,'#29234a');rect(x+4,y+5,16,9,'#edaa6a');rect(x+5,y+6,3,3,'#2e254b');rect(x+16,y+6,3,3,'#2e254b');rect(x+1,y+14,22,10,'#ff557f');rect(x-3,y+14,5,12,'#edaa6a');rect(x+22,y+14,5,12,'#edaa6a');rect(x+3,y+24,7,6,'#313077');rect(x+14,y+24,7,6,'#313077');rect(x+2,y+29,9,3,'#fff0b9');rect(x+13,y+29,9,3,'#fff0b9')}function drawVehicle(i,x,y,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);if(i===0){rect(-70,-23,100,33,'#d22b54');rect(30,-44,51,54,'#ef574e');rect(41,-36,28,22,'#7fd5f4');rect(-64,-19,83,6,'#ffbd63');rect(72,-7,16,8,'#ffe171');rect(-54,8,21,16,'#18172e');rect(8,8,21,16,'#18172e');rect(49,8,21,16,'#18172e');rect(19,-28,9,5,'#d8d8e0');rect(-62,-27,94,4,'#fbdc67')}else if(i===1){rect(-70,-32,142,45,'#f5b842');rect(-54,-28,95,20,'#4ec3d2');rect(44,-27,23,20,'#4ec3d2');rect(-55,-5,120,5,'#ffec9d');rect(-45,10,24,16,'#191c32');rect(39,10,24,16,'#191c32');rect(67,-3,7,8,'#ffe4a3')}else{rect(-88,-38,175,52,'#a74dde');rect(-80,-29,157,18,'#53daef');for(let j=0;j<6;j++)rect(-75+j*25,-26,17,13,['#ffdc5a','#fc618a','#79eea7'][j%3]);rect(-82,-3,160,12,'#ed62bc');rect(-65,10,25,18,'#24233d');rect(47,10,25,18,'#24233d');rect(77,-5,13,9,'#ffe27b');for(let j=0;j<8;j++)rect(-74+j*20,-40,8,5,j%2?'#ffdf49':'#77ffaf')}g.restore()}function drawWorld(){rect(0,0,640,576,'#243e75');for(let i=0;i<10;i++){let y=80+i*40;rect(0,y,640,40,i%2?'#2478b9':'#2188c5');for(let j=0;j<15;j++){let x=((j*71+frame*(i%2?1.1:-.8)+i*37)%720+720)%720-40;rect(x,y+12+(j%3)*8,21,3,'#80d6dc');rect(x+8,y+4+(j%3)*8,8,2,'#48b7ce')}}rect(0,0,640,80,'#659653');rect(0,480,640,96,'#61924e');for(let i=0;i<64;i++){let x=(i*89)%640;rect(x,5+(i*37)%70,7,5,i%2?'#4a793d':'#97bd56');rect((i*43)%640,485+(i*29)%88,7,5,i%2?'#4b783e':'#9cbd5a')}rect(0,75,640,8,'#dfc57b');rect(0,477,640,9,'#dfc57b');for(let i=0;i<16;i++){rect(i*40,76,20,3,'#fff1bb');rect(i*40,480,20,3,'#fff1bb')}rect(2,2,636,3,'#c9de81');rect(2,571,636,3,'#c9de81');for(let j=0;j<3;j++){let x=105+j*212;rect(x-91,5,182,64,'#4b6f39');rect(x-85,9,170,54,'#8ca15c')}drawVehicle(0,105,45,.57);drawVehicle(1,317,45,.55);drawVehicle(2,529,45,.53);for(let j=0;j<3;j++)txt(['BIG RIG','VAN','PARTY BUS'][j],105+j*212,70,10,'#fff4ac');if(state==='choice'){rect(80+selected*212,3,52,4,'#fff');txt('▼',105+selected*212,15,17,'#fff')}for(let lane of lanes){for(let o of lane.objects){let x=o.x,y=o.y;if(lane.type==='rock'){rect(x+5,y,25,8,'#919bab');rect(x,y+8,34,18,'#6c768d');rect(x+5,y+26,23,4,'#404a69');rect(x+9,y+4,13,4,'#d6d4bf')}else if(lane.type==='log'){rect(x+5,y,93,24,'#673c36');rect(x,y+7,103,15,'#a36a3e');rect(x+12,y+5,70,3,'#e1a253');rect(x+17,y+15,65,3,'#75442a');rect(x+87,y+5,10,15,'#e1a253');rect(x+91,y+8,3,8,'#865232')}else{rect(x+2,y+7,65,21,'#2d7e51');rect(x+47,y+2,30,21,'#3c9b5b');rect(x+70,y+15,10,12,'#297346');for(let k=0;k<4;k++)rect(x+12+k*12,y+3,6,7,'#8ccf62');rect(x+61,y+7,5,5,'#fff5a8');rect(x+63,y+8,2,3,'#202b35');rect(x+51,y+21,25,3,'#c4dc81')}}}drawPerson();for(let p of sparkles){rect(p.x,p.y,4,4,p.color)}if(state==='playing'){txt('↑ CROSS THE RIVER ↑',320,558,16,'#fff2af')} }
function overlay(){if(state==='title'){rect(70,167,500,225,'#1e1748');rect(79,176,482,207,'#453168');txt('RIVER RUN',320,233,45,'#ffdd52');txt('1986',320,265,23,'#ff70af');txt('CROSS THE RIVER. SURVIVE.',320,303,18,'#9cf9f0');txt('THREE RIDES. ONE DESTINATION.',320,331,15,'#fff4b4');if(Math.floor(frame/32)%2===0)txt('PRESS START OR ANY ARROW',320,364,17,'#ffffff')}else if(state==='choice'){rect(38,203,564,170,'#201741');rect(47,212,546,152,'#493071');txt('YOU MADE IT!',320,247,32,'#ffe46a');txt('CHOOSE YOUR RIDE',320,278,19,'#8ff5ea');txt('← → SELECT     ENTER CONFIRM',320,322,16,'#fff');txt(buttons[selected],320,348,20,'#ff93bb')}else if(state==='won'){rect(54,175,532,233,'#241943');rect(64,185,512,213,'#4d3374');txt('★ YOU WIN! ★',320,236,39,'#ffdb55');txt('YOUR RIDE: '+buttons[selected],320,281,22,'#92fbec');txt('SCORE '+String(score).padStart(5,'0'),320,315,20,'#ffffff');txt('PRESS START TO PLAY AGAIN',320,362,17,'#ffd5ef')}else if(state==='gameover'){rect(70,186,500,186,'#23183f');rect(79,195,482,168,'#633052');txt('GAME OVER',320,248,43,'#ff6b8c');txt('SCORE '+String(score).padStart(5,'0'),320,292,22,'#ffe586');txt('PRESS START TO TRY AGAIN',320,340,17,'#fff')} }function update(){frame++;if(msgTimer>0)msgTimer--;if(invuln>0)invuln--;for(let p of sparkles){p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.t--}for(let i=sparkles.length-1;i>=0;i--)if(sparkles[i].t<=0)sparkles.splice(i,1);if(state==='playing'){levelClock++;let carrier=false;const centerY=player.y+16;if(centerY>=80&&centerY<480){for(let lane of lanes){for(let o of lane.objects){o.x+=lane.speed;if(lane.speed>0&&o.x>675)o.x=-o.w-10;if(lane.speed<0&&o.x+o.w< -35)o.x=675}if(Math.abs(centerY-(lane.y+20))<=19){for(let o of lane.objects){if(overlap(player,o)){if(lane.type==='log'){carrier=true;player.x+=lane.speed}else if(invuln<=0){damage();break}}}if(lane.type==='log'&&!carrier&&invuln<=0)damage()}}if(player.x<0||player.x>616)damage()}}}function draw(){drawWorld();overlay()}function loop(){update();draw();requestAnimationFrame(loop)}const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};window.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();if(!e.repeat)move(keys[e.key])}else if(['Enter',' '].includes(e.key)){e.preventDefault();if(state==='choice')win();else if(state!=='playing')restart()}});document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.dir)});});document.querySelector('#start').addEventListener('click',()=>{if(state==='choice')win();else restart()});c.addEventListener('pointerdown',e=>{if(state==='title'||state==='gameover'||state==='won'){restart();return}if(state==='choice'){let box=c.getBoundingClientRect(),x=(e.clientX-box.left)/box.width*W;if(x<213)selected=0;else if(x<427)selected=1;else selected=2;win()}});resetLevel();loop()})();
</script></body></html>
